name: Build and test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node src/test/js/daily-patients.test.cjs
      - run: sh ./mvnw -B -ntp verify
      - name: Verify Docker build
        run: docker build -t trung-cang-his:ci .
