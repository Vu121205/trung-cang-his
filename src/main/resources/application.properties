spring.application.name=trung-cang-his

spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:3306/trung_cang_his
spring.datasource.username=${MYSQL_USERNAME:root}
spring.datasource.password=${MYSQL_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql=false
his.facility.name=${HIS_FACILITY_NAME:Phòng khám Trung Cang}
his.facility.address=${HIS_FACILITY_ADDRESS:205 Lạc Hồng, P. Vĩnh Hiệp, TP. Rạch Giá, Kiên Giang}
his.facility.phone=${HIS_FACILITY_PHONE:Chưa cấu hình}
