<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/head :: head('Tiếp nhận')}"></head>
  <body>
    <nav th:replace="~{fragments/header :: header}"></nav>
    <main class="container-fluid px-3 px-lg-4 py-3">
      <div class="alert alert-info d-flex align-items-center gap-2 py-2 mb-3" role="status">
        <i class="fa-solid fa-location-dot"></i>
        <span>Đang làm việc tại <strong id="activeRoom">phòng tiếp nhận</strong></span>
      </div>
      <section class="page-section" id="section-reception">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h5 class="fw-bold mb-0 text-dark">
            <i class="fa-solid fa-clipboard-user text-primary me-2"></i>
            Tiếp nhận Bệnh nhân &amp; Phân phòng
          </h5>
          <button class="btn btn-outline-primary btn-sm rounded-2 d-lg-none" onclick="openNewPatientModal()">
            <i class="fa-solid fa-window-restore me-1"></i>
            Đăng ký Modal
          </button>
        </div>
        <div class="row g-3">
          <!-- Cột trái: Tra cứu & Form nhập thông tin bệnh nhân trực tiếp -->
          <div class="col-lg-5">
            <!-- Card Form Nhập Thông Tin Bệnh Nhân -->
            <div class="card">
              <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center py-2">
                <span class="fw-bold">
                  <i class="fa-solid fa-user-plus me-2"></i>
                Nhập Thông Tin Bệnh Nhân
                </span>
                <button class="btn btn-xs btn-light text-dark fw-semibold" onclick="clearReceptionForm()" title="Làm mới form" type="button">
                  <i class="fa-solid fa-rotate-right me-1"></i>
                  Xóa form
                </button>
              </div>
              <div class="card-body p-3">
                <form
                  id="inlineReceptionForm"
                  onsubmit="
                    event.preventDefault();
                    submitInlinePatient();
                  "
                >
                  <input id="recPatientId" type="hidden" value="" />
                  <div class="row g-2 mb-2">
                    <div class="col-md-7">
                      <label class="form-label extra-small fw-semibold mb-1" for="recName">Họ và Tên <span class="required-mark">*</span></label>
                      <input class="form-control form-control-sm" id="recName" placeholder="NHẬP HỌ VÀ TÊN..." required="" type="text" minlength="2" maxlength="150" data-validation="person-name" />
                    </div>
                    <div class="col-md-5">
                      <label class="form-label extra-small fw-semibold mb-1" for="recPhone">Số Điện Thoại <span class="required-mark">*</span></label>
                      <input class="form-control form-control-sm" id="recPhone" placeholder="09xxxxxxxx" required="" type="tel" data-validation="phone" />
                    </div>
                  </div>
                  <div class="row g-2 mb-2">
                    <div class="col-md-4">
                      <label class="form-label extra-small fw-semibold mb-1" for="recDob">Ngày sinh</label>
                      <input class="form-control form-control-sm" id="recDob" type="date" data-validation="birth-date" />
                    </div>
                    <div class="col-md-4">
                      <label class="form-label extra-small fw-semibold mb-1" for="recGender">Giới tính</label>
                      <select class="form-select form-select-sm" id="recGender">
                        <option value="Nam">Nam</option>
                        <option value="Nữ">Nữ</option>
                        <option value="Khác">Khác</option>
                      </select>
                    </div>
                    <div class="col-md-4">
                      <label class="form-label extra-small fw-semibold mb-1" for="recInsuranceType">Đối tượng</label>
                      <input class="form-control form-control-sm" id="recInsuranceType" value="Dịch vụ" readonly />
                    </div>
                  </div>
                  <div class="row g-2 mb-2">
                    <div class="col-md-6">
                      <label class="form-label extra-small fw-semibold mb-1" for="recIdentity">Số CCCD</label>
                      <input class="form-control form-control-sm" id="recIdentity" placeholder="Nhập số CCCD (nếu có)..." type="text" maxlength="20" data-validation="identity" />
                    </div>
                  </div>
                  <div class="row g-2 mb-2">
                    <div class="col-md-6">
                      <label class="form-label extra-small fw-semibold mb-1" for="recRoom">Phòng khám tiếp nhận <span class="required-mark">*</span></label>
                      <select class="form-select form-select-sm" id="recRoom" required=""><option value="">-- Chọn phòng khám --</option></select>
                    </div>
                  </div>
                  <div class="mb-2">
                    <label class="form-label extra-small fw-semibold mb-1" for="recAddress">Địa chỉ thường trú</label>
                    <input class="form-control form-control-sm" id="recAddress" placeholder="Số nhà, Đường, Phường/Xã, Quận/Huyện..." type="text" maxlength="255" />
                  </div>
                  <div class="mb-3">
                    <label class="form-label extra-small fw-semibold mb-1" for="recReason">Lý do khám / Triệu chứng ban đầu</label>
                    <textarea class="form-control form-control-sm" id="recReason" placeholder="Đau đầu, sốt, tái khám, kiểm tra định kỳ..." rows="2" maxlength="500"></textarea>
                  </div>
                  <div class="d-grid">
                    <button class="btn btn-primary btn-sm fw-semibold py-2" type="submit">
                      <i class="fa-solid fa-check-circle me-1"></i>
                      <span id="receptionSubmitLabel">Đăng Ký &amp; Cấp Số Thứ Tự</span>
                    </button>
                  </div>
                </form>
              </div>
            </div>
          </div>
          <!-- Cột phải: Danh sách bệnh nhân chờ khám trong ngày -->
          <div class="col-lg-7">
            <div class="card h-100">
              <div class="card-header d-flex justify-content-between align-items-center">
                <span>
                  <i class="fa-solid fa-list-ol me-2 text-secondary"></i>
                  Danh sách Tiếp nhận trong ngày
                </span>
                <span class="badge bg-secondary" id="totalQueueCount">4 Bệnh nhân</span>
              </div>
              <div class="card-body p-0">
                <div class="table-responsive">
                  <table class="table table-hover table-custom align-middle mb-0" id="queueTable">
                    <thead>
                      <tr>
                        <th class="ps-3">STT</th>
                        <th>Mã BN</th>
                        <th>Họ và Tên</th>
                        <th>Năm sinh/Giới tính</th>
                        <th>Phòng khám</th>
                        <th>Trạng thái</th>
                        <th class="text-end pe-3">Thao tác</th>
                      </tr>
                    </thead>
                    <tbody id="receptionTableBody">
                      <!-- Dynamic rows populated via JS -->
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>
    <div aria-hidden="true" class="modal fade" id="newPatientModal" tabindex="-1">
      <div class="modal-dialog modal-lg">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title fw-bold">
              <i class="fa-solid fa-user-plus text-primary me-2"></i>
              Đăng Ký Hồ Sơ Bệnh Nhân Mới
            </h5>
            <button aria-label="Close" class="btn-close" data-bs-dismiss="modal" type="button"></button>
          </div>
          <div class="modal-body">
            <form id="newPatientForm" onsubmit="event.preventDefault(); submitNewPatient();">
              <div class="row g-3">
                <div class="col-md-6">
                  <label class="form-label fw-semibold" for="newPtName">Họ và Tên <span class="required-mark">*</span></label>
                  <input class="form-control" id="newPtName" placeholder="Nhập họ tên đầy đủ..." required="" type="text" minlength="2" maxlength="150" data-validation="person-name" />
                </div>
                <div class="col-md-3">
                  <label class="form-label fw-semibold" for="newPtDob">Ngày sinh</label>
                  <input class="form-control" id="newPtDob" type="date" data-validation="birth-date" />
                </div>
                <div class="col-md-3">
                  <label class="form-label fw-semibold" for="newPtGender">Giới tính</label>
                  <select class="form-select" id="newPtGender">
                    <option>Nam</option>
                    <option>Nữ</option>
                    <option>Khác</option>
                  </select>
                </div>
                <div class="col-md-6">
                  <label class="form-label fw-semibold" for="newPtPhone">Số điện thoại <span class="required-mark">*</span></label>
                  <input class="form-control" id="newPtPhone" placeholder="09xxxx..." required="" type="tel" data-validation="phone" />
                </div>
                <div class="col-md-6">
                  <label class="form-label fw-semibold" for="newPtIdentity">Số CCCD</label>
                  <input class="form-control" id="newPtIdentity" placeholder="Nhập số CCCD..." type="text" maxlength="20" data-validation="identity" />
                </div>
                <div class="col-md-6">
                  <label class="form-label fw-semibold" for="newPtRoom">Phân phòng khám <span class="required-mark">*</span></label>
                  <select class="form-select" id="newPtRoom" required=""><option value="">-- Chọn phòng khám --</option></select>
                </div>
                <div class="col-md-12">
                  <label class="form-label fw-semibold" for="newPtAddress">Địa chỉ thường trú</label>
                  <input class="form-control" id="newPtAddress" placeholder="Số nhà, Đường, Phường/Xã, Quận/Huyện..." type="text" maxlength="255" />
                </div>
                
                <div class="col-md-6">
                  <label class="form-label fw-semibold" for="newPtReason">Lý do đến khám</label>
                  <input class="form-control" id="newPtReason" placeholder="Đau đầu, sốt, tái khám..." type="text" maxlength="500" />
                </div>
              </div>
            </form>
          </div>
          <div class="modal-footer">
            <button class="btn btn-secondary" data-bs-dismiss="modal" type="button">Hủy</button>
            <button class="btn btn-primary" onclick="submitNewPatient()" type="button">Lưu &amp; Cấp Số Thứ Tự</button>
          </div>
        </div>
      </div>
    </div>
    <div class="position-fixed bottom-0 end-0 p-3 toast-container">
      <div id="liveToast" class="toast align-items-center text-white bg-success border-0" role="alert">
        <div class="d-flex">
          <div class="toast-body" id="toastMessage">Cập nhật dữ liệu thành công!</div>
          <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
        </div>
      </div>
    </div>
    <script>
      (function showActiveRoom() {
        const params = new URLSearchParams(window.location.search);
        let selection;
        try {
          selection = JSON.parse(localStorage.getItem('hisRoomSelection') || 'null');
        } catch (error) {
          selection = null;
        }
        const department = params.get('khoa') || (selection && selection.department);
        const room = params.get('phong') || (selection && selection.room);
        if (department && room) {
          document.getElementById('activeRoom').textContent = `${room} (${department})`;
          document.querySelector('.text-white-50').textContent = room;
        }
      })();
    </script>
    <th:block th:replace="~{fragments/footer :: scripts}"></th:block>
  </body>
</html>
