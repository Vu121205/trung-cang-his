<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Quản lý kho')}"></head>
<body>
<nav th:replace="~{fragments/header :: header}"></nav>
<main class="container-fluid px-3 px-lg-4 py-3">
  <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
    <div><h4 class="page-title mb-1"><i class="fa-solid fa-boxes-stacked text-primary me-2"></i>Quản lý kho</h4><span class="text-muted small">Theo dõi danh mục, lô hàng và hạn sử dụng</span></div>
    <button class="btn btn-primary btn-sm" type="button" data-bs-toggle="modal" data-bs-target="#batchModal"><i class="fa-solid fa-plus me-1"></i>Nhập lô thuốc</button>
  </div>
  <div id="inventoryMessage" class="alert d-none" role="alert"></div>
  <section class="card">
    <div class="card-header"><form id="inventoryFilter" class="row g-2 align-items-end"><div class="col-md-4"><label for="inventoryKeyword" class="form-label small fw-semibold mb-1">Tìm kiếm</label><input id="inventoryKeyword" class="form-control form-control-sm" placeholder="Mã, tên hoặc hoạt chất"></div><div class="col-md-3"><label for="inventoryWarehouse" class="form-label small fw-semibold mb-1">Kho</label><select id="inventoryWarehouse" class="form-select form-select-sm"><option value="">Tất cả kho</option><option value="MEDICINE">Kho thuốc</option><option value="SUPPLY">Kho vật tư</option></select></div><div class="col-md-3"><label for="inventoryActive" class="form-label small fw-semibold mb-1">Trạng thái</label><select id="inventoryActive" class="form-select form-select-sm"><option value="true">Đang hoạt động</option><option value="false">Tất cả</option></select></div><div class="col-auto"><button class="btn btn-outline-primary btn-sm" type="submit"><i class="fa-solid fa-filter me-1"></i>Lọc</button></div></form></div>
    <div class="table-responsive"><table class="table table-hover table-custom align-middle mb-0"><thead><tr><th class="ps-3">Kho</th><th>Mã</th><th>Tên hàng</th><th>Đơn vị</th><th class="text-end">Tồn khả dụng</th><th>Hạn gần nhất</th><th>Trạng thái</th><th class="text-end pe-3">Thao tác</th></tr></thead><tbody id="inventoryBody"><tr><td colspan="8" class="text-center text-muted py-4">Đang tải dữ liệu...</td></tr></tbody></table></div>
  </section>
</main>
<div class="modal fade" id="batchModal" tabindex="-1" aria-labelledby="batchModalTitle" aria-hidden="true"><div class="modal-dialog"><form id="batchForm" class="modal-content"><div class="modal-header"><h5 id="batchModalTitle" class="modal-title">Nhập lô thuốc mới</h5><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Đóng"></button></div><div class="modal-body"><div class="mb-2"><label for="batchMedicine" class="form-label small fw-semibold">Thuốc <span class="required-mark">*</span></label><select id="batchMedicine" class="form-select form-select-sm" required></select></div><div class="row g-2"><div class="col-6"><label for="batchNumber" class="form-label small fw-semibold">Số lô <span class="required-mark">*</span></label><input id="batchNumber" class="form-control form-control-sm" required></div><div class="col-6"><label for="batchQuantity" class="form-label small fw-semibold">Số lượng <span class="required-mark">*</span></label><input id="batchQuantity" type="number" min="0" class="form-control form-control-sm" required></div><div class="col-6"><label for="batchManufacture" class="form-label small fw-semibold">Ngày sản xuất</label><input id="batchManufacture" type="date" class="form-control form-control-sm"></div><div class="col-6"><label for="batchExpiry" class="form-label small fw-semibold">Hạn sử dụng</label><input id="batchExpiry" type="date" class="form-control form-control-sm"></div><div class="col-6"><label for="batchPrice" class="form-label small fw-semibold">Đơn giá</label><input id="batchPrice" type="number" min="0" step="0.01" class="form-control form-control-sm"></div></div></div><div class="modal-footer"><button type="button" class="btn btn-outline-secondary btn-sm" data-bs-dismiss="modal">Hủy</button><button class="btn btn-primary btn-sm" type="submit">Lưu lô thuốc</button></div></form></div></div>
<th:block th:replace="~{fragments/footer :: scripts}"></th:block><script src="/resources/js/inventory.js"></script>
</body></html>
