<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/head :: head('Danh mục dịch vụ')}"></head>
  <body>
    <!-- Mẫu bố cục: đổi ID và nối dữ liệu/handler trước khi dùng làm trang nghiệp vụ. -->
    <nav th:replace="~{fragments/header :: header}"></nav>
    <main class="container-fluid px-3 px-lg-4 py-3">
      <section class="page-section" aria-labelledby="servicePageTitle">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
          <h1 id="servicePageTitle" class="h5 page-title mb-0">
            <i class="fa-solid fa-notes-medical text-primary me-2" aria-hidden="true"></i>Danh mục dịch vụ
          </h1>
        </div>
        <div id="serviceMessage" role="status" aria-live="polite" class="small text-muted mb-3">Chưa kết nối nguồn dữ liệu.</div>
        <div class="row g-3">
          <div class="col-lg-5">
            <div class="card">
              <div class="card-header">Thông tin dịch vụ</div>
              <div class="card-body p-3">
                <form id="serviceForm">
                  <div class="mb-3">
                    <label for="serviceName" class="form-label small fw-semibold mb-1">Tên dịch vụ <span class="required-mark">*</span></label>
                    <input id="serviceName" name="name" class="form-control form-control-sm" placeholder="Nhập tên dịch vụ..." required />
                  </div>
                  <div class="mb-3">
                    <label for="serviceDescription" class="form-label small fw-semibold mb-1">Mô tả</label>
                    <textarea id="serviceDescription" name="description" class="form-control form-control-sm" rows="3" placeholder="Nhập mô tả..."></textarea>
                  </div>
                  <div id="serviceFormError" role="alert" class="small text-danger mb-2"></div>
                  <!-- Chỉ bật Lưu sau khi đã nối xử lý submit và nguồn dữ liệu. -->
                  <div class="d-flex flex-wrap gap-2">
                    <button class="btn btn-primary btn-sm" type="submit" disabled>Lưu dịch vụ</button>
                    <button class="btn btn-outline-secondary btn-sm" type="reset">Xóa form</button>
                  </div>
                </form>
              </div>
            </div>
          </div>
          <div class="col-lg-7">
            <div class="card h-100">
              <div class="card-header">Danh sách dịch vụ</div>
              <div class="card-body p-0">
                <div class="table-responsive">
                  <table class="table table-hover table-custom align-middle mb-0">
                    <caption class="visually-hidden">Danh sách dịch vụ</caption>
                    <thead><tr><th scope="col" class="ps-3">Mã</th><th scope="col">Tên dịch vụ</th><th scope="col" class="text-end pe-3">Thao tác</th></tr></thead>
                    <tbody id="serviceRows"><tr><td colspan="3" class="text-center text-muted py-4">Chưa kết nối nguồn dữ liệu.</td></tr></tbody>
                  </table>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>
    <div class="position-fixed bottom-0 end-0 p-3 toast-container">
      <div id="liveToast" class="toast align-items-center text-white bg-success border-0" role="status" aria-live="polite" aria-atomic="true">
        <div class="d-flex">
          <div class="toast-body" id="toastMessage"></div>
          <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Đóng thông báo"></button>
        </div>
      </div>
    </div>
    <footer th:replace="~{fragments/footer :: footer}"></footer>
    <th:block th:replace="~{fragments/footer :: scripts}"></th:block>
  </body>
</html>
